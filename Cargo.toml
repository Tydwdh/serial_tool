[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/databus",
    "crates/extension",
    "crates/lua_host",
    "crates/panels",
    "crates/recorder",
    "crates/testing",
    "crates/transport",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
eframe = { version = "0.34", features = ["persistence", "glow"] }
egui = "0.34"
crossbeam-channel = "0.5"
dirs-next = "2"
log = "0.4"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8"
thiserror = "2"
open = "5"
# ── 发布优化：减小体积、提升性能 ──
[profile.release]
opt-level = "s"   # 优化体积
lto = true        # 链接时优化
codegen-units = 1 # 单代码生成单元，更好地内联
strip = true      # 去除调试符号
