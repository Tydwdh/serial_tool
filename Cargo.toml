[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/databus",
    "crates/extension",
    "crates/lua_host",
    "crates/panels",
    "crates/recorder",
    "crates/testing",
    "crates/transport",
    "crates/wasm_host",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8"
thiserror = "2"
wasmtime = "45.0.1"
wat = "1.251.0"
# ── 发布优化：减小体积、提升性能 ──
[profile.release]
opt-level = "s"   # 优化体积
lto = true        # 链接时优化
codegen-units = 1 # 单代码生成单元，更好地内联
strip = true      # 去除调试符号
