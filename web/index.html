<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base data-trunk-public-url>
    <title>Hardware Workbench</title>
    <style>
        :root { color-scheme: dark; background: #1f2430; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1f2430; }
        body { display: flex; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="hardware-workbench" aria-label="Hardware Workbench"></canvas>
    <!-- Keep the generated module after the canvas so the wasm-bindgen start
         hook can find it when WebRunner is initialized. Rust already performs
         release optimization; disable Trunk's incompatible wasm-opt pass. -->
    <link data-trunk rel="rust" href="../crates/app/Cargo.toml" data-bin="hardware-workbench-app" data-wasm-opt="0">
</body>
</html>
