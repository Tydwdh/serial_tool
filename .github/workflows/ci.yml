name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      # 压力门禁：断言是结构性的（行索引保持完整、无损订阅不丢事件），
      # 不是计时，所以 debug 下即可作为回归门禁。计时测量仍按
      # docs/performance.md 手工用 --release --nocapture 采集。
      # 只选这两个 crate，避免把 crates/app 里依赖安静调度、故意 ignore 的
      # 计时测试拉进 CI。
      - name: Pressure gates
        run: cargo test -p tool-panels -p tool-databus -- --ignored

      - name: Verify release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'hardware-workbench-app').version
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Cargo version $version"
          }
          $releaseNotes = 'docs/releases/${{ github.ref_name }}.md'
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Release notes not found: $releaseNotes"
          }

      - name: Package portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\package.bat

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\installer\build-installer.ps1 -SkipPackage

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @(
            'dist/hardware-workbench-app.zip',
            'dist/HardwareWorkbenchSetup.exe'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding utf8NoBOM

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hardware-workbench-windows
          path: |
            dist/hardware-workbench-app.zip
            dist/HardwareWorkbenchSetup.exe
            dist/SHA256SUMS.txt

  linux-deb:
    name: Ubuntu .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Linux cargo check
        run: cargo check --workspace

      - name: Linux clippy
        # 整包 `-D warnings` 现在会把作业变红：`crates/app` 的自动更新链路在 Linux 下
        # 被 cfg 关掉，留下 9 处 dead_code / clippy 诊断（逐条清单与复现方法见
        # docs/ARCHITECTURE.md 的「Linux clippy 的 -D warnings 缺口」）。
        # 因此先把 `-D warnings` 加在**除 app 之外**的全部 crate 上：Linux 专属
        # （`cfg(not(windows))` / `cfg(target_os = "linux")`）的 clippy 回归就此无处藏身。
        # 补齐 app 的 Linux cfg 覆盖后删掉 `--exclude`，本步即与 Windows 作业完全对齐。
        run: |
          cargo clippy --workspace --all-targets --exclude hardware-workbench-app -- -D warnings
          cargo clippy --workspace --all-targets

      - name: Linux tests
        run: cargo test --workspace --all-targets

      - name: Build Ubuntu package
        run: bash ./installer/linux/build-deb.sh

      - name: Verify Debian package metadata
        run: |
          deb="$(find dist -maxdepth 1 -type f -name 'hardware-workbench_*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"

      - name: Install and smoke-test Debian package
        run: |
          deb="$(readlink -f "$(find dist -maxdepth 1 -type f -name 'hardware-workbench_*.deb' -print -quit)")"
          test -n "$deb"
          package="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get install -y "$deb"
          binary="/usr/lib/hardware-workbench/hardware-workbench-app"
          desktop="/usr/share/applications/hardware-workbench.desktop"
          icon="/usr/share/icons/hicolor/256x256/apps/hardware-workbench.png"
          resource_dir="/usr/lib/hardware-workbench/assets"
          test -x "$binary"
          test -f "$desktop"
          test -f "$icon"
          test -f "$resource_dir/JetBrainsMonoNerdFontMono-Regular.ttf"
          test -f "$resource_dir/NotoSansSC-VF.ttf"
          ! ldd "$binary" | grep -F 'not found'
          test "$(dpkg -L "$package" | grep -Fx "$desktop")" = "$desktop"
          sudo apt-get remove -y "$package"

      - name: Generate Linux checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          deb="$(find dist -maxdepth 1 -type f -name 'hardware-workbench_*.deb' -print -quit)"
          sha256sum "$deb" | sed 's#dist/##' > dist/SHA256SUMS-linux.txt

      - name: Upload Linux artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hardware-workbench-linux
          path: |
            dist/hardware-workbench_*.deb
            dist/SHA256SUMS-linux.txt

  wasm:
    name: WASM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install and verify WASM target
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target list --installed
          test -d "$(rustc --print sysroot)/lib/rustlib/wasm32-unknown-unknown/lib"

      - uses: Swatinem/rust-cache@v2

      - name: Check Web target
        run: cargo check --target wasm32-unknown-unknown -p hardware-workbench-app

      - name: Lint Web target
        run: cargo clippy --target wasm32-unknown-unknown -p hardware-workbench-app -- -D warnings

  release:
    name: GitHub Release
    runs-on: windows-latest
    needs: [test, linux-deb, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: hardware-workbench-windows

      - uses: actions/download-artifact@v4
        with:
          name: hardware-workbench-linux

      - name: Record digest of the zip that will be uploaded
        id: uploaded_zip
        # 这一步**必须**排在 Create Release 之前：它哈希的就是要被上传的那一个文件，
        # 后面算 pinned 值的那份来自第二次 download-artifact（不同调用、不同目录），
        # 两者一旦分叉，pin 描述的字节就不是用户拿到的字节。
        run: |
          $zipPath = "hardware-workbench-app.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "release 产物缺失：$zipPath"
          }
          $uploadedSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "sha256=$uploadedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          Write-Host "uploaded zip sha256: $uploadedSha"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Hardware Workbench ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            hardware-workbench-app.zip
            HardwareWorkbenchSetup.exe
            hardware-workbench_*_amd64.deb
            SHA256SUMS.txt
            SHA256SUMS-linux.txt
          generate_release_notes: true

      - name: Checkout default branch for updater manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # 上一步 checkout 会清掉工作区里未跟踪的产物，这里重新取回待发布 zip，
      # 只为算摘要——不入库。
      - name: Download release assets for checksum
        uses: actions/download-artifact@v4
        with:
          name: hardware-workbench-windows
          path: release-assets

      - name: Generate and commit update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $branch = "${{ github.event.repository.default_branch }}"
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^[vV]', ''
          $chinaTime = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), "China Standard Time")
          $date = $chinaTime.ToString("yyyy-MM-dd")
          $downloadUrl = "https://github.com/Tydwdh/serial_tool/releases/download/$tag/hardware-workbench-app.zip"
          $zipPath = "release-assets/hardware-workbench-app.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "release 产物缺失：$zipPath"
          }
          # 下限把关：`Get-FileHash -Algorithm SHA256` 对 0 字节或被截断的产物同样给出
          # **格式完全合法**的 64 位十六进制摘要，所以旧代码那句 `$sha256.Length -ne 64`
          # 是一条永远不会触发的恒真检查（这就是本步原来唯一的"校验"）。字节数不骗人：
          # 一个被截断的 zip 必须先在这里红，而不是变成所有客户端的 pinned 值。
          $minZipBytes = 1048576
          $zipBytes = (Get-Item -LiteralPath $zipPath).Length
          if ($zipBytes -lt $minZipBytes) {
            throw "release 产物过小（$zipBytes < $minZipBytes 字节），拒绝用它的摘要作为 pinned 值：$zipPath"
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          # 形状检查**不是**防线（同上，`Get-FileHash` 恒过），留着只防"将来把来源
          # 换成别的算法或别的文件时把畸形值静默写进 manifest"。真正兜底的是下面两次比对。
          if ($sha256 -notmatch '^[0-9a-f]{64}$') { throw "SHA256 形状异常：$sha256" }
          # 比对 1/2：同一份 artifact 自带的 SHA256SUMS.txt（test 作业在打包之后、
          # 上传之前用同一个 dist/ 生成）。产物被截断、被换成别的文件、或清单与产物
          # 不匹配，都会在这里变红；"恰好 1 行"这个计数断言同时挡住重复行与缺行。
          $sumsPath = "release-assets/SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $sumsPath)) {
            throw "artifact 内缺少 $sumsPath，无法交叉校验 pinned 摘要"
          }
          $declared = @(Get-Content -LiteralPath $sumsPath | ForEach-Object {
            if ($_ -match '^\s*([0-9a-f]{64})\s+hardware-workbench-app\.zip\s*$') { $Matches[1] }
          })
          if ($declared.Count -ne 1) {
            throw "SHA256SUMS.txt 里 hardware-workbench-app.zip 应有且仅有 1 行，实际 $($declared.Count) 行"
          }
          # `-ne` 在 PowerShell 里默认大小写无关，与客户端 `verify_stream_sha256` 的
          # `eq_ignore_ascii_case` 一致：两侧都只认值、不认写法。
          if ($declared[0] -ne $sha256) {
            throw "pinned 摘要与 artifact 自带 SHA256SUMS.txt 不一致：待写 $sha256，声明 $($declared[0])"
          }
          # 比对 2/2：本步哈希的文件来自第二次 download-artifact，而**上传给用户**的那份
          # 来自第一次，中间还夹了一次 checkout。分叉的后果是"pin 描述的不是用户装的东西"，
          # 所以拿 Create Release 之前记下的摘要再对一次。
          $uploadedSha = '${{ steps.uploaded_zip.outputs.sha256 }}'
          if (-not $uploadedSha) {
            throw "未取得已上传产物的摘要（uploaded_zip 步骤的输出为空），拒绝生成 update.json"
          }
          if ($uploadedSha -ne $sha256) {
            throw "pinned 摘要与已上传到 Release 的 zip 不一致：上传 $uploadedSha，待写 $sha256"
          }
          Write-Host "update.json pinned sha256: $sha256"
          $changelog = [System.Collections.Generic.List[string]]::new()
          $inVersion = $false
          $heading = '^## \[' + [regex]::Escape($version) + '\](?: - .*)?$'
          foreach ($line in Get-Content -LiteralPath 'CHANGELOG.md') {
            if ($line -match $heading) {
              $inVersion = $true
              continue
            }
            if ($inVersion -and $line -match '^## ') {
              break
            }
            if ($inVersion -and $line -match '^- (.+)$') {
              $changelog.Add($Matches[1])
            }
          }
          if ($changelog.Count -eq 0) {
            throw "No changelog entries found for $version"
          }
          $json = @{
            version = $version
            date = $date
            download_url = $downloadUrl
            sha256 = $sha256
            changelog = @($changelog)
          } | ConvertTo-Json
          $json | Out-File -FilePath "update.json" -Encoding utf8NoBOM
          Write-Host "Generated update.json:"
          Get-Content update.json
          git add update.json
          $changedFiles = git diff --cached --name-only
          if (-not $changedFiles) {
            Write-Host "update.json unchanged"
          } else {
            git commit -m "Update update.json for ${{ github.ref_name }}"
            git push origin "HEAD:$branch"
          }
