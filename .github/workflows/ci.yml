name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Package portable zip
        run: .\package.bat

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\installer\build-installer.ps1 -SkipPackage

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hardware-workbench-windows
          path: |
            dist/hardware-workbench-app.zip
            dist/HardwareWorkbenchSetup.exe

  release:
    name: GitHub Release
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hardware-workbench-windows

      - name: Generate update.json
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $date = Get-Date -Format "yyyy-MM-dd"
          $downloadUrl = "https://github.com/Tydwdh/serial_tool/releases/download/$tag/hardware-workbench-app.zip"
          $json = @{
            version = $version
            date = $date
            download_url = $downloadUrl
            changelog = @()
          } | ConvertTo-Json
          $json | Out-File -FilePath "update.json" -Encoding utf8NoBOM
          Write-Host "Generated update.json:"
          Get-Content update.json

      - name: Commit update.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "Update update.json for ${{ github.ref_name }}"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hardware Workbench ${{ github.ref_name }}
          files: |
            hardware-workbench-app.zip
            HardwareWorkbenchSetup.exe
          generate_release_notes: true
