[package]
name = "egui_tiles"
version = "0.16.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "A tiling layout engine for egui with drag-and-drop and resizing"
repository = "https://github.com/rerun-io/egui_tiles"

[features]
default = ["serde"]
serde = ["dep:serde", "egui/serde"]

[dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }
egui = { version = "0.35.0", default-features = false }
itertools = "0.14.0"
log = { version = "0.4.28", features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }
