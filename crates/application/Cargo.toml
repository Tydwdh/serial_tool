[package]
name = "tool-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "UI-independent application core — Workbench facade + Command/Query/Event"

[lib]
name = "tool_application"
path = "src/lib.rs"

[dependencies]
crossbeam-channel.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tool-core = { path = "../core" }
tool-databus = { path = "../databus" }
tool-platform = { path = "../platform" }
tool-recorder = { path = "../recorder" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tool-extension = { path = "../extension" }
tool-marketplace = { path = "../marketplace" }
tool-lua-host = { path = "../lua_host" }
tool-transport = { path = "../transport" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tool-testing = { path = "../testing" }
