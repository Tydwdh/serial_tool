<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="串口监视模式界面效果图" class="sans">
  <title>硬件调试工作台 · 串口监视模式</title>
  <style>
    svg {
